name: Unit Tests

on:
  push:
    branches: [main, master, dev, develop]
    paths:
      - 'src/copaw/**'
      - 'src/qwenpaw/**'
      - 'tests/unit/**'
      - 'tests/contract/**'
      - 'tests/conftest.py'
      - 'scripts/check_namespace_boundaries.py'
      - 'scripts/check_copaw_locale_split.py'
      - 'console/src/locales/**'
      - 'pyproject.toml'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [main, master, dev, develop]
    paths:
      - 'src/copaw/**'
      - 'src/qwenpaw/**'
      - 'tests/unit/**'
      - 'tests/contract/**'
      - 'tests/conftest.py'
      - 'scripts/check_namespace_boundaries.py'
      - 'scripts/check_copaw_locale_split.py'
      - 'console/src/locales/**'
      - 'pyproject.toml'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  unit-tests:
    name: Unit Tests - py${{ matrix.python-version }}
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true')
    runs-on: ubuntu-latest
    # The py3.11 leg needs the whole unit suite plus the three gates and the
    # L1 hard gate: measured in CI at ~1,000 s.  A smaller cap kills the
    # suite mid-run and the must-pass steps after it report skipped.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      # ``check_p1_invariants.py`` diffs the tree against the fork point, so a
      # shallow checkout makes the gate abort before the tests below can run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tests/unit/hub/test_process_isolation.py runs a real sandboxed child
      # and the provisioner raises instead of skipping when bwrap is absent
      # ("Local isolation requires bubblewrap (bwrap) on Linux").  Upstream's
      # Tests workflow installs this dependency; without it the two
      # test_linux_runtime_filesystem_is_shared_and_persistent cases are red in
      # every leg of this one.
      - name: Install Linux isolation dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns \
            >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Stdlib-only static check on console/src/locales, so it needs neither the
      # npm install nor the python deps below.
      - name: Check CoPaw locale split guard
        run: python scripts/check_copaw_locale_split.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The ``hub`` extra is not optional here: tests/unit/hub/
          # test_docker_provisioner.py imports the ``docker`` package with no
          # importorskip guard, and upstream's own nightly leg installs
          # ``.[dev,test,full]`` (full pulls hub).  mcp is bounded by
          # pyproject.toml, so this leg must not override that range.
          pip install -e ".[dev,test,hub]"

      - name: Check namespace boundaries (gate)
        if: matrix.python-version == '3.11'
        run: |
          git fetch --depth=1 https://github.com/agentscope-ai/CoPaw.git main:qwenpaw_upstream_main || true
          python scripts/check_namespace_boundaries.py --upstream-ref qwenpaw_upstream_main

      - name: Check P1 invariants (gate)
        if: matrix.python-version == '3.11'
        run: |
          python scripts/check_p1_invariants.py --check
          python scripts/copaw_brand.py verify

      - name: Release channel consistency (gate)
        if: matrix.python-version == '3.11'
        run: python scripts/check_release_channel_consistency.py

      - name: Run all unit tests (informational — pre-existing failures tolerated)
        continue-on-error: true
        run: |
          pytest tests/unit \
            --ignore=tests/unit/channels \
            -v \
            --tb=line \
            -q

      - name: Fail loudly if nothing was collected
        run: |
          pytest tests/unit --ignore=tests/unit/channels --collect-only -q 2>&1 \
            | tee /tmp/collect.txt | tail -n 3
          grep -Eq "[1-9][0-9]* tests? collected" /tmp/collect.txt \
            || { echo "::error::pytest collected zero tests — the suite is not running"; exit 1; }

      - name: Run L1 hard gate tests (must pass)
        run: |
          pytest \
            tests/unit/security \
            tests/contract/security \
            tests/unit/agents/hooks \
            tests/unit/agents/memory \
            tests/unit/agents/utils \
            -v \
            --tb=long \
            -s \
            --log-cli-level=WARNING

  coverage:
    name: Coverage Report
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,hub]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --ignore=tests/unit/channels \
            --cov=src/qwenpaw \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short \
            || true

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.0
          thresholdNew: 0.0
          thresholdModified: 0.0
